name: GUT Unit Tests

# The addon's scenes are saved by a Godot 4.8 build (nodes carry a unique_id), so the 4.7 container the
# other addons here test in cannot parse them. This downloads the same Godot the Pages workflow uses.
#
# which inherits the Controls addon's controls.tscn, so the checkout has to be recursive or the demo
# project cannot open.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GODOT_VERSION: 4.8-dev4

jobs:
  gut:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Fetch the addon dependencies
        shell: bash
        run: python tools/pull_addons.py


      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Blender when the project has a .blend
        shell: bash
        run: |
          set -euo pipefail
          if ! find . -name '*.blend' -not -path './.git/*' | grep -q .; then
            echo "No .blend in this repository; Godot will never reach for Blender."
            exit 0
          fi
          echo "Found a .blend; installing Blender."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          # Godot must be told where Blender is. Without this it fails with "Cannot configure blender
          # path in headless mode", and that error aborts the WHOLE import: no fonts, no textures, and
          # an export a tenth of its proper size.
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION%%-*}.tres"
          mkdir -p "$(dirname "$settings")"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo 'filesystem/import/blender/blender_path = "/usr/bin/blender"'
          } > "$settings"
          blender --version | head -1

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          for _ in 1 2 3 4; do
            godot --headless --path "$PWD" --import
          done

      - name: Run tests
        shell: bash
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          set -euo pipefail
          mkdir -p test-results
          godot \
            --headless \
            --audio-driver Dummy \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://addons/3d_player_controller/tests,res://addons/3d_player_controller/inventory/tests,res://addons/3d_player_controller/inventory/tests/integration \
            -gjunit_xml_file=test-results/gut-junit.xml \
            -gcompact_mode \
            -gexit

      # A run that found no tests (GUT missing, a script that failed to parse, a wrong -gdir) can exit 0; a
      # report with no test cases in it, or no report at all, fails the job instead of passing it.
      - name: Fail on a run with no tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = sum(1 for _ in ET.parse("test-results/gut-junit.xml").getroot().iter("testcase"))
          print(f"{cases} test case(s) in the JUnit report")
          sys.exit(0 if cases > 0 else 1)
          PY

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gut-test-reports
          path: test-results/
          if-no-files-found: warn
