<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Godot Head Base -->
  <rect x="20" y="36" width="88" height="68" rx="16" fill="#478cbf"/>

  <!-- Outer Side Ears (No Center Antenna) -->
  <rect x="36" y="20" width="12" height="18" rx="3" fill="#478cbf"/>
  <rect x="80" y="20" width="12" height="18" rx="3" fill="#478cbf"/>

  <!-- Left Eye: D-Pad -->
  <path d="M 42 54 H 48 V 60 H 54 V 66 H 48 V 72 H 42 V 66 H 36 V 60 H 42 Z" fill="#ffffff"/>

  <!-- Right Eye: 3D Axis Cube (Player / 3D Controller) -->
